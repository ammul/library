---
layout: default
---
<article class="story">
  <header class="story-header">
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% endif %}
  </header>

  <div class="story-body">
    {{ content }}
  </div>

  <footer class="story-footer">
    <a href="{{ '/' | prepend: site.baseurl }}">&larr; Back to all stories</a>
  </footer>
</article>
