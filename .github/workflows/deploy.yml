name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stories.json
        run: |
          python3 - <<'EOF'
          import os, json, re

          stories_dir   = "stories"
          # Add more codes here (e.g. "fr", "es") to support additional languages
          supported_langs = ["de"]
          stories = []

          for filename in sorted(os.listdir(stories_dir)):
              if not filename.endswith(".md"):
                  continue
              # Skip translation files — they are linked from their primary entry
              if re.search(r'_[a-z]{2}\.md$', filename):
                  continue

              with open(os.path.join(stories_dir, filename), encoding="utf-8") as f:
                  content = f.read()

              # Defaults from filename
              title = filename.replace(".md", "").replace("-", " ").title()
              date  = ""

              # Parse YAML front matter if present
              fm_match = re.match(r"^---\r?\n([\s\S]*?)\r?\n---", content)
              if fm_match:
                  fm = fm_match.group(1)
                  t  = re.search(r'^title:\s*["\']?(.*?)["\']?\s*$', fm, re.MULTILINE)
                  d  = re.search(r'^date:\s*(\S+)',                   fm, re.MULTILINE)
                  if t: title = t.group(1)
                  if d: date  = d.group(1)

              # Detect which translation files exist alongside this story
              basename     = filename[:-3]  # strip .md
              translations = {}
              for lang in supported_langs:
                  trans_file = f"{basename}_{lang}.md"
                  if os.path.exists(os.path.join(stories_dir, trans_file)):
                      translations[lang] = trans_file

              stories.append({
                  "file":         filename,
                  "title":        title,
                  "date":         date,
                  "translations": translations,   # e.g. {"de": "the-fog_de.md"}
              })

          # Newest first
          stories.sort(key=lambda s: s["date"], reverse=True)

          with open("stories.json", "w") as f:
              json.dump(stories, f, indent=2)

          print(f"✓ stories.json — {len(stories)} primary story/stories")
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
