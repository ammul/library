title: The Library
description: A small collection of short stories.

# Change these to match your GitHub username and repo name
url: "https://your-username.github.io"
baseurl: "/library"  # must match your repository name exactly

markdown: kramdown
kramdown:
  input: GFM

# Declare the stories collection so Jekyll outputs one page per story
collections:
  stories:
    output: true
    permalink: /stories/:name/

defaults:
  - scope:
      path: ""
      type: stories
    values:
      layout: story

exclude:
  - .claude
  - "*.md.bak"
