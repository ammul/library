<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Library</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header">
    <nav>
      <a class="site-title" href="./index.html">The Library</a>
    </nav>
  </header>

  <main>
    <article class="story" id="story-container">
      <p class="loading">Loading…</p>
    </article>
  </main>

  <footer class="site-footer">
    <p>The Library</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const file   = params.get('file');
      const el     = document.getElementById('story-container');

      if (!file) {
        el.innerHTML = '<p>No story specified. <a href="./index.html">Go back.</a></p>';
        return;
      }

      // Fetch story + manifest in parallel
      let raw, translations = {};
      try {
        const [storyRes, manifestRes] = await Promise.all([
          fetch(`./stories/${encodeURIComponent(file)}`),
          fetch('./stories.json')
        ]);

        if (!storyRes.ok) throw new Error(`HTTP ${storyRes.status}`);
        raw = await storyRes.text();

        if (manifestRes.ok) {
          const manifest = await manifestRes.json();
          const meta = manifest.find(s => s.file === file) || {};
          translations = meta.translations || {};
        }
      } catch (err) {
        el.innerHTML = `<p class="error">Could not load story: ${err.message}</p>`;
        return;
      }

      // ---- Helpers ----

      function parseFrontMatter(text) {
        const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
        let title = file.replace(/\.md$/, '').replace(/-/g, ' ');
        let date = '', body = text;
        if (match) {
          const fm = match[1];
          body = match[2];
          const tm = fm.match(/^title:\s*["']?(.*?)["']?\s*$/m);
          const dm = fm.match(/^date:\s*(\S+)/m);
          if (tm) title = tm[1];
          if (dm) date  = dm[1];
        }
        return { title, date, body };
      }

      function formatDate(str) {
        try {
          return new Date(str + 'T00:00:00').toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
          });
        } catch { return str; }
      }

      // ---- Initial render ----

      const cache = { en: parseFrontMatter(raw) };
      const langs  = ['en', ...Object.keys(translations)]; // e.g. ['en', 'de']
      let currentLang = 'en';

      // Language switcher — only rendered when translations exist
      const switcherHTML = langs.length > 1
        ? `<div class="lang-switcher" id="lang-switcher">${
            langs.map(l =>
              `<button data-lang="${l}"${l === 'en' ? ' class="active"' : ''}>${l.toUpperCase()}</button>`
            ).join('')
          }</div>`
        : '';

      const { title, date, body } = cache.en;
      document.title = `${title} — The Library`;

      // Render the full structure once.
      // On language switch we update only: #story-title, #story-date, #story-body, button states.
      el.innerHTML = `
        <header class="story-header">
          <h1 id="story-title">${title}</h1>
          <div class="story-meta">
            <time id="story-date" datetime="${date}">${date ? formatDate(date) : ''}</time>
            ${switcherHTML}
          </div>
        </header>
        <div class="story-body" id="story-body">${marked.parse(body)}</div>
        <footer class="story-footer">
          <a href="./index.html">&larr; Back to all stories</a>
        </footer>`;

      // ---- Language switching (single event delegation, attached once) ----

      const switcher = document.getElementById('lang-switcher');
      if (switcher) {
        switcher.addEventListener('click', async e => {
          const btn = e.target.closest('button[data-lang]');
          if (!btn || btn.dataset.lang === currentLang) return;

          const lang = btn.dataset.lang;

          // Lazy-fetch translation on first use, then cache it
          if (!cache[lang]) {
            try {
              const res = await fetch(`./stories/${encodeURIComponent(translations[lang])}`);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              cache[lang] = parseFrontMatter(await res.text());
            } catch (err) {
              document.getElementById('story-body').innerHTML =
                `<p class="error">Could not load translation: ${err.message}</p>`;
              return;
            }
          }

          currentLang = lang;
          const { title, date, body } = cache[lang];

          document.title = `${title} — The Library`;
          document.getElementById('story-title').textContent = title;

          const dateEl = document.getElementById('story-date');
          dateEl.setAttribute('datetime', date || '');
          dateEl.textContent = date ? formatDate(date) : '';

          document.getElementById('story-body').innerHTML = marked.parse(body);

          switcher.querySelectorAll('button').forEach(b =>
            b.classList.toggle('active', b.dataset.lang === lang)
          );
        });
      }
    })();
  </script>
</body>
</html>
